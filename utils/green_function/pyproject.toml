[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gf3d"
version = "0.1.0"
description = "Green function extraction from a specfem3d_globe reciprocal database"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
# numpy only: the package is a ctypes binding, so there is nothing to
# compile at install time and no build backend to depend on. obspy is
# needed by Result.to_stream() alone.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
obspy = ["obspy>=1.4"]

# Not package dependencies: nothing in gf3d/ imports these. They are what
# tests/gf3d needs -- 9c runs gf_sac_check.py, which imports gf_compare.py,
# which needs h5py and scipy, and obspy reads the SAC files.
[dependency-groups]
test = ["obspy>=1.4", "h5py", "scipy"]

[tool.setuptools]
packages = ["gf3d"]
